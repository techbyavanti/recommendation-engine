# SonarQube analysis for all languages in this repository: Java, TypeScript,
# Python, shell, Dockerfiles and the Protobuf contracts.
# CI runs it against a temporary SonarQube container. To run it against a
# local server, see scripts/sonar-scan.sh.
sonar.projectKey=techbyavanti_recommendation-engine
sonar.projectName=Recommendation Engine
sonar.sourceEncoding=UTF-8

# Production code
sonar.sources=rec-support/src/main,\
  search-service/src/main,\
  recommender-service/src/main,\
  graphql-gateway/src/main,\
  web/src,\
  web/index.html,\
  training,\
  scripts,\
  proto,\
  search-service/Dockerfile,\
  recommender-service/Dockerfile,\
  graphql-gateway/Dockerfile,\
  web/Dockerfile,\
  docker-compose.yml
sonar.exclusions=**/.venv*/**,**/__pycache__/**,target/**,**/*.test.ts,**/*.test.tsx,web/src/setupTests.ts,training/test_*.py,training/*.csv

# Test code
sonar.tests=rec-support/src/test,\
  search-service/src/test,\
  recommender-service/src/test,\
  graphql-gateway/src/test,\
  web/src,\
  training
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx,web/src/setupTests.ts,training/test_*.py

# Java: classes come from `mvn verify`, libraries from
# `mvn dependency:copy-dependencies`.
sonar.java.source=26
sonar.java.binaries=rec-support/target/classes,\
  search-service/target/classes,\
  recommender-service/target/classes,\
  graphql-gateway/target/classes
sonar.java.test.binaries=rec-support/target/test-classes,\
  search-service/target/test-classes,\
  recommender-service/target/test-classes,\
  graphql-gateway/target/test-classes
sonar.java.libraries=*/target/dependency/*.jar
sonar.java.test.libraries=*/target/dependency/*.jar

# Coverage: JaCoCo (Java) and Vitest (TypeScript).
sonar.coverage.jacoco.xmlReportPaths=rec-support/target/site/jacoco/jacoco.xml,\
  search-service/target/site/jacoco/jacoco.xml,\
  recommender-service/target/site/jacoco/jacoco.xml,\
  graphql-gateway/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.python.version=3
