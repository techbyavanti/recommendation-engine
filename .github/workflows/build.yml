name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    # A temporary SonarQube server for the code-quality analysis. It starts
    # with the job, so it is ready when the build is done, and it is deleted
    # with the job. No account or secret is necessary.
    services:
      sonarqube:
        image: sonarqube:26.10.0.133078-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube uses the full history to find new code and its authors.
          fetch-depth: 0

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # ubuntu-latest is x86_64, so protoc-gen-grpc-java's native binary for
      # this platform is genuinely native (unlike macOS, where the
      # "osx-aarch_64" classifier ships an x86_64 binary requiring Rosetta 2
      # — a dev-machine-only concern, not relevant here).
      # `verify` also writes each module's JaCoCo coverage report. The
      # libraries for the SonarQube analysis are copied in the same run, so
      # the reactor supplies the internal rec-support jar.
      - name: Run Java unit tests
        run: mvn -B verify dependency:copy-dependencies -DincludeScope=test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web unit tests
        working-directory: web
        run: npm test -- --coverage

      - name: Build web
        working-directory: web
        run: npm run build

      # --- Code quality: SonarQube analyzes Java, TypeScript, Python, shell
      #     and Dockerfiles with the coverage from the steps above. The
      #     quality gate fails this job on any bug, vulnerability, code
      #     smell, or unreviewed hotspot, on more than 3% duplication, or on
      #     coverage below 50%. Configuration: sonar-project.properties. ---
      - name: Prepare SonarQube
        run: |
          # Both values are for this job's temporary server only.
          SONAR_ADMIN_PASSWORD="Ci-$(openssl rand -hex 16)-Pw1"
          echo "::add-mask::${SONAR_ADMIN_PASSWORD}"
          SONAR_TOKEN="$(SONAR_ADMIN_PASSWORD="${SONAR_ADMIN_PASSWORD}" ./scripts/sonar-setup.sh)"
          echo "::add-mask::${SONAR_TOKEN}"
          echo "SONAR_TOKEN=${SONAR_TOKEN}" >> "$GITHUB_ENV"

      - name: SonarQube analysis
        env:
          SONAR_SKIP_BUILD: 'true'
        run: ./scripts/sonar-scan.sh

      - name: Add the SonarQube report to the job summary
        if: always() && hashFiles('target/sonar-report/summary.md') != ''
        run: cat target/sonar-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the SonarQube report
        if: always() && hashFiles('target/sonar-report/summary.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sonarqube-report
          path: target/sonar-report/

  # --- Trivy filesystem scan: known CVEs in resolved dependencies (Maven
  #     and npm both — trivy fs scans package-lock.json too), Dockerfile
  #     misconfigurations (root user, missing HEALTHCHECK, etc.), and
  #     committed secrets ---
  cve-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan dependencies, Dockerfiles, and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          format: table

      - name: Re-run as SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-deps.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  # --- SAST: source itself, not just dependencies — Java backend and the
  #     TypeScript/React frontend both ---
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep (Java + TypeScript security rules)
        run: semgrep scan --config p/java --config p/typescript --config p/react --config p/security-audit --config p/secrets --metrics=off --error
      - name: Re-run as SARIF for the Security tab
        if: always()
        run: semgrep scan --config p/java --config p/typescript --config p/react --config p/security-audit --config p/secrets --metrics=off --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --- Secret detection: block committed credentials before they land in an image layer ---
  secret-scan:
    runs-on: ubuntu-latest
    # On pull_request events gitleaks-action lists the PR's commits through
    # the GitHub API, so it needs the token and read access to pull requests.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Dockerfile lint: catch misconfigurations (missing USER, unpinned base, etc.)
  #     across all four images in this polyglot repo ---
  docker-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [search-service, recommender-service, graphql-gateway, web]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile

  # --- Build each real runtime image and scan it for OS/JRE/Node-level CVEs
  #     before it would ever reach a registry ---
  docker-image-scan:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one service's real CVE finding cancels the sibling
      # matrix legs before they even report — every service needs its own
      # independent pass/fail signal.
      fail-fast: false
      matrix:
        include:
          - service: search-service
            context: .
            dockerfile: search-service/Dockerfile
          - service: recommender-service
            context: .
            dockerfile: recommender-service/Dockerfile
          - service: graphql-gateway
            context: .
            dockerfile: graphql-gateway/Dockerfile
          - service: web
            context: ./web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.service }}:${{ github.sha }} ${{ matrix.context }}

      - name: Scan image for OS/runtime CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      # Medium findings fail the build only when a fixed package exists.
      # The Dockerfiles upgrade all OS packages, so a failure here means
      # that the fix is in a dependency or a newer base image.
      - name: Scan image for fixable medium CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: MEDIUM
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Re-run as SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: ${{ matrix.service }}-sbom.cyclonedx.json
